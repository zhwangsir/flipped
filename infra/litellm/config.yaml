# LiteLLM Proxy 配置 — flipped M0（决策 D1）
# 链路: 客户端/编辑器 -> 本代理(:4000) -> exo 集群(:52415) -> GLM-5.2-fp8
# M149: api_base 用 MagicDNS 主机名 studio01-1（原裸 IP 100.64.201.37 因 Tailscale
#   IP 漂移失效导致全链路 000；主机名免疫 IP 变化，对应节点 macstudio01）
# M149 单模型模式: architect = coder = GLM-5.2-fp8（用户决策：K2.7 不稳定且能力不比 GLM 强，
#   先只跑 GLM-5.2-fp8；Kimi 恢复后改回 coder -> Kimi-K2.7-Code-4bit 即可）
# 启动: litellm --config infra/litellm/config.yaml --port 4000

model_list:
  # architect(编排者) -> GLM-5.2-fp8
  - model_name: architect
    litellm_params:
      model: openai/mlx-community/GLM-5.2-fp8
      api_base: http://studio01-1:52415/v1
      api_key: dummy-exo-no-auth
      # M149: temperature=0 — fp8 非零 temperature 下长序列生成数值不稳定→乱码
      temperature: 0.0
      extra_body:
        enable_thinking: false
        chat_template_kwargs:
          enable_thinking: false

  # M149: coder(执行者) -> GLM-5.2-fp8（原为 Kimi-K2.7-Code-4bit；Kimi 掉线时
  #   fallback 会降级到 GLM 造成来回切换抖动，单模型模式直接指同模型 + 自环 fallback 重试）
  - model_name: coder
    litellm_params:
      model: openai/mlx-community/GLM-5.2-fp8
      api_base: http://studio01-1:52415/v1
      api_key: dummy-exo-no-auth
      # M149: temperature=0 — 同上，fp8 数值稳定性
      temperature: 0.0
      extra_body:
        enable_thinking: false
        chat_template_kwargs:
          enable_thinking: false

router_settings:
  # M149.12 修复: 单模型模式下删除 coder<->architect 互环 fallback。
  #   事故实录(v10): exo 重建期上游返回空 body, coder 失败 -> fallback architect
  #   (同一后端, 同样失败) -> 再 fallback coder ... 互环放大 x num_retries=2 x
  #   timeout=600s, 单次 LLM 调用拖 16min 才报错, task 被误判失败。
  #   单模型=同后端, fallback 无意义; 快速失败由 SDK num_retries 兜底更清晰。
  #   Kimi 恢复双模型后, 再改回跨模型单向降级: [{ "coder": ["architect"] }]
  num_retries: 2
  timeout: 600          # 本地大模型首 token 慢, 调大避免误触发降级
  allowed_fails: 3
  cooldown_time: 30     # 连续失败后冷却该部署的秒数

litellm_settings:
  drop_params: true      # 丢弃上游不支持的参数, 提升 OpenAI 兼容性
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # 代理对外鉴权; 所有请求需带 Authorization: Bearer
  # database_url: "postgresql://drt:local_validate_a225f3b04dd8ff43@localhost:5432/drt"  # M0.3 原 postgres; prisma binaries 丢失时注释掉走内存
