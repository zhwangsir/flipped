# LiteLLM Proxy 配置 — flipped M0（决策 D1）
# 链路: 客户端/编辑器 -> 本代理(:4000) -> exo 集群(:52415) -> GLM-5.2-fp8 / Kimi-K2.7-Code-4bit
# M149: api_base 用 MagicDNS 主机名（原裸 IP 100.64.201.37 因 Tailscale
#   IP 漂移失效导致全链路 000；主机名免疫 IP 变化，对应节点 macstudio01）
# M192: MagicDNS 主机名漂移跟进——tailnet 中该节点现为 dgmt-studio01mac-studio
#   （100.67.43.40；旧名 studio01-1 已 Unknown host）
# M156 双模型模式恢复: architect=GLM-5.2-fp8, coder=Kimi-K2.7-Code-4bit
#   解除 M147-A 熔断（GLM 单模型 reasoning_content 抢占 content 路径不可代码修复）。
#   M149 单模型作为逃生门：把 coder model 改回 GLM-5.2-fp8 + 注释 fallbacks 即可。
# 启动: litellm --config infra/litellm/config.yaml --port 4000

model_list:
  # architect(编排者) -> GLM-5.2-fp8
  - model_name: architect
    litellm_params:
      model: openai/mlx-community/GLM-5.2-fp8
      api_base: http://dgmt-studio01mac-studio:52415/v1
      api_key: dummy-exo-no-auth
      # M149: temperature=0 — fp8 非零 temperature 下长序列生成数值不稳定→乱码
      temperature: 0.0
      extra_body:
        enable_thinking: false
        chat_template_kwargs:
          enable_thinking: false

  # M156: coder(执行者) -> Kimi-K2.7-Code-4bit（双模型恢复，Kimi 在 exo 已就绪）
  #   M149 期间临时改 GLM-5.2-fp8 是因 Kimi 掉线；现恢复双模型分工。
  - model_name: coder
    litellm_params:
      model: openai/mlx-community/Kimi-K2.7-Code-4bit
      api_base: http://dgmt-studio01mac-studio:52415/v1
      api_key: dummy-exo-no-auth
      temperature: 0.0
      # Kimi-K2.7-Code 无 reasoning_content 路径抢占问题，可不传 enable_thinking；
      # 但保留 false 与 architect 一致，避免 chat_template 误打开思考模式。
      extra_body:
        enable_thinking: false
        chat_template_kwargs:
          enable_thinking: false

router_settings:
  # M156 恢复跨模型单向降级: coder 失败 → fallback architect（不同后端，有意义）。
  #   M149.12 单模型期删除此 fallback 是因 coder/architect 同后端互环放大超时；
  #   双模型恢复后必须改回单向，避免 Kimi 临时抖动直接挂任务。
  #   注意：architect 不配置 fallback，避免反向互环。
  fallbacks:
    - coder: [architect]
  num_retries: 2
  timeout: 600          # 本地大模型首 token 慢, 调大避免误触发降级
  allowed_fails: 3
  cooldown_time: 30     # 连续失败后冷却该部署的秒数

litellm_settings:
  drop_params: true      # 丢弃上游不支持的参数, 提升 OpenAI 兼容性
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # 代理对外鉴权; 所有请求需带 Authorization: Bearer
  # database_url: "postgresql://drt:local_validate_a225f3b04dd8ff43@localhost:5432/drt"  # M0.3 原 postgres; prisma binaries 丢失时注释掉走内存
