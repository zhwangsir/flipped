# LiteLLM Proxy 配置 — flipped M0（决策 D1）
# 链路: 客户端/编辑器 -> 本代理(:4000) -> exo 集群(:52415) -> {GLM-5.2, Kimi-K2.7-Code}
# 默认别名: architect = GLM-5.2(编排者/架构师) ; coder = Kimi-K2.7-Code(执行者/码农)
# M89 交替接力: GLM-5.2 Worker 卡死,切 Kimi 接力
# 当前轮次: architect=GLM-5.2(监督), coder=Kimi-K2.7-Code(接力执行)
# 启动: litellm --config infra/litellm/config.yaml --port 4000

model_list:
  # M89 当前: architect(编排者) -> GLM-5.2-fp8(监督,关闭 reasoning)
  - model_name: architect
    litellm_params:
      model: openai/mlx-community/GLM-5.2-fp8
      api_base: http://100.64.201.37:52415/v1
      api_key: os.environ/EXO_API_KEY
      extra_body:
        enable_thinking: false
        chat_template_kwargs:
          enable_thinking: false

  # M89 当前: coder(执行者) -> Kimi-K2.7-Code-4bit(接力,关闭 reasoning)
  - model_name: coder
    litellm_params:
      model: openai/mlx-community/Kimi-K2.7-Code-4bit
      api_base: http://100.64.201.37:52415/v1
      api_key: os.environ/EXO_API_KEY
      extra_body:
        enable_thinking: false
        chat_template_kwargs:
          enable_thinking: false

router_settings:
  # 双向降级: 某别名报错(429/500/超时)时路由到另一个 (key/value 必须是 model_name 别名)
  fallbacks: [{ "architect": ["coder"] }, { "coder": ["architect"] }]
  num_retries: 2
  timeout: 600          # 本地大模型首 token 慢, 调大避免误触发降级
  allowed_fails: 3
  cooldown_time: 30     # 连续失败后冷却该部署的秒数

litellm_settings:
  drop_params: true      # 丢弃上游不支持的参数, 提升 OpenAI 兼容性
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # 代理对外鉴权; 所有请求需带 Authorization: Bearer
  # database_url: "postgresql://drt:local_validate_a225f3b04dd8ff43@localhost:5432/drt"  # M0.3 原 postgres; prisma binaries 丢失时注释掉走内存
