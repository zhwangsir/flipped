# SearXNG 自托管 — flipped M1.1
# 启动: cd infra/searxng && docker compose up -d
# 验证: curl 'http://localhost:8080/search?q=test&format=json'
services:
  searxng:
    image: searxng/searxng:latest
    container_name: flipped-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
